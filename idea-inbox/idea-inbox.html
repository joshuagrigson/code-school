<title>Idea Inbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-first column — capture slip on top, deal flow below; the open idea replaces the list as a memo. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --sunk: #e8ecf3;
  --ink: #141b2b;
  --muted: #5a6478;
  --line: #d5dbe6;
  --accent: #b27600;
  --accent-ink: #ffffff;
  --accent-soft: #fbefd6;
  --good: #1f7a4d;
  --good-soft: #dcf1e5;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --bad: #b23a3a;
  --bad-soft: #f8dede;
  --info: #2d5aa8;
  --info-soft: #dfe8f8;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #161d2e; --sunk: #1d2639; --ink: #e9edf5; --muted: #98a2b8; --line: #2a3550;
    --accent: #f0b429; --accent-ink: #1a1400; --accent-soft: #3a2e10;
    --good: #5fd39a; --good-soft: #143326; --warn: #f3b860; --warn-soft: #3a2a10;
    --bad: #ff8b8b; --bad-soft: #3d1a1d; --info: #8fb4ff; --info-soft: #18264a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2e; --sunk: #1d2639; --ink: #e9edf5; --muted: #98a2b8; --line: #2a3550;
  --accent: #f0b429; --accent-ink: #1a1400; --accent-soft: #3a2e10;
  --good: #5fd39a; --good-soft: #143326; --warn: #f3b860; --warn-soft: #3a2a10;
  --bad: #ff8b8b; --bad-soft: #3d1a1d; --info: #8fb4ff; --info-soft: #18264a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand p { color: var(--muted); }
.tally { display: flex; gap: 6px; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }
.st-new { background: var(--info-soft); color: var(--info); }
.st-reviewing { background: var(--warn-soft); color: var(--warn); }
.st-pursue { background: var(--good-soft); color: var(--good); }
.st-pass { background: var(--bad-soft); color: var(--bad); }
.st-saved { background: var(--sunk); color: var(--muted); }

/* capture slip */
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.slip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 13.5px; }
input[type="url"], input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
}
textarea { min-height: 110px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, .idea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.platform { font-size: 12.5px; color: var(--muted); min-height: 18px; }
.platform b { color: var(--ink); }
.shots { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.shots img { width: 56px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.filebtn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; font-weight: 600; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; }
button.link { border: none; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; }
button:disabled { opacity: 0.55; cursor: progress; }
.hint { font-size: 13px; color: var(--muted); }
.notice { font-size: 13.5px; padding: 10px 12px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); }
.notice.err { background: var(--bad-soft); color: var(--bad); }
.progress { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

/* deal flow */
.flow { display: flex; flex-direction: column; gap: 10px; }
.flow-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { padding: 5px 11px; font-size: 13px; border-radius: 999px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.idea { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left; width: 100%; font-weight: 400; }
.idea:hover { border-color: var(--accent); }
.score { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); font-family: var(--f-mono); font-size: 19px; }
.score small { display: block; font-size: 10px; color: var(--muted); margin-top: -4px; }
.score.hi { background: var(--good-soft); color: var(--good); }
.score.mid { background: var(--warn-soft); color: var(--warn); }
.score.lo { background: var(--bad-soft); color: var(--bad); }
.idea-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.idea-body h3 { font-size: 16px; }
.idea-body p { color: var(--muted); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); }
.empty h3 { color: var(--ink); }

/* memo */
.memo { display: flex; flex-direction: column; gap: 18px; }
.memo-top { display: flex; flex-direction: column; gap: 10px; }
.memo-top h2 { font-size: 26px; font-weight: 800; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.verdict .score { width: 64px; height: 64px; font-size: 24px; }
.verdict-word { font-family: var(--f-display); font-weight: 800; font-size: 19px; }
.bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; }
.bar { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.bar-top { display: flex; justify-content: space-between; gap: 6px; }
.track { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec > .label { color: var(--accent); }
.canvas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 20px; }
.cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell ul, .sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.money { width: 100%; border-collapse: collapse; font-size: 14px; }
.money td, .money th { padding: 7px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.money th { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.money td.r, .money th.r { text-align: right; padding-left: 12px; white-space: nowrap; }
.money tr.total td { font-weight: 700; border-bottom: none; }
.tablebox { overflow-x: auto; }
.scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.scen div { background: var(--sunk); border-radius: 9px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.weeks { display: flex; flex-direction: column; gap: 12px; }
.week { display: grid; grid-template-columns: 74px 1fr; gap: 12px; }
.week .label { padding-top: 2px; }
.pairs { display: flex; flex-direction: column; gap: 10px; }
.pair { display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.pair:last-child { border-bottom: none; padding-bottom: 0; }
.pair .muted { font-size: 14px; }
.callout { background: var(--accent-soft); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.statusbar { display: flex; gap: 6px; flex-wrap: wrap; }
.statusbar button { padding: 7px 13px; font-size: 13.5px; }
.statusbar button[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: -2px; }
.src { font-size: 13.5px; word-break: break-all; }
.src a { color: var(--info); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }
pre.raw { white-space: pre-wrap; font-size: 13px; background: var(--sunk); padding: 12px; border-radius: 9px; margin: 0; max-height: 240px; overflow: auto; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Idea Inbox</h1>
      <p>Drop in a reel or post. Get back a business model to review.</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>

  <main id="home">
    <div class="wrap" style="gap:22px">
      <form class="slip" id="capture" autocomplete="off">
        <div class="slip-head">
          <h2>New idea</h2>
          <button type="button" class="link" id="example">Fill with an example</button>
        </div>
        <div class="field">
          <label for="url">Link to the reel or post</label>
          <input type="url" id="url" inputmode="url" placeholder="Paste the link: Share → Copy Link">
          <div class="platform" id="platform"></div>
        </div>
        <div class="field">
          <label for="caption">What the post says</label>
          <textarea id="caption" placeholder="Paste the caption, or type what the person said in the video: the idea, the numbers they claimed, how they say it makes money."></textarea>
          <span class="hint">Claude can't open Instagram or TikTok links from here, so this box and the screenshots are what it reads.</span>
        </div>
        <div class="field">
          <span class="label" style="font-size:12px">Screenshots (optional)</span>
          <div class="shots" id="shots">
            <label class="filebtn" id="filebtn"><input type="file" id="files" accept="image/*" multiple>Add screenshots</label>
          </div>
        </div>
        <div class="field">
          <label for="angle">Anything to steer it (optional)</label>
          <input type="text" id="angle" placeholder="e.g. keep startup under $500, I'd run it nights and weekends">
        </div>
        <div id="formMsg" hidden></div>
        <div class="progress" id="progress" hidden><span class="dot"></span><span id="progressText">Building the model…</span></div>
        <div class="row">
          <button type="submit" class="primary" id="buildBtn">Build business model</button>
          <button type="button" class="ghost" id="saveBtn">Save for later</button>
        </div>
      </form>

      <section class="flow" aria-labelledby="flowTitle">
        <div class="flow-head">
          <h2 id="flowTitle">Your ideas</h2>
          <div class="filters" id="filters"></div>
        </div>
        <div id="list" class="flow"></div>
      </section>
    </div>
  </main>

  <main id="detail" hidden></main>
</div>

<script>
(() => {
  const STATUSES = [
    { id: "saved", label: "Not built" },
    { id: "new", label: "New" },
    { id: "reviewing", label: "Reviewing" },
    { id: "pursue", label: "Pursue" },
    { id: "pass", label: "Pass" },
  ];
  const statusLabel = (s) => (STATUSES.find((x) => x.id === s) || STATUSES[1]).label;

  const PLATFORMS = [
    [/instagram\.com|instagr\.am/, "Instagram"],
    [/tiktok\.com/, "TikTok"],
    [/facebook\.com|fb\.watch|fb\.com/, "Facebook"],
    [/youtube\.com|youtu\.be/, "YouTube"],
    [/(^|\.)x\.com|twitter\.com/, "X"],
    [/threads\.net|threads\.com/, "Threads"],
    [/linkedin\.com/, "LinkedIn"],
    [/reddit\.com|redd\.it/, "Reddit"],
    [/pinterest\.|pin\.it/, "Pinterest"],
    [/snapchat\.com/, "Snapchat"],
  ];
  function platformOf(u) {
    try {
      const host = new URL(u).hostname.toLowerCase();
      for (const [re, name] of PLATFORMS) if (re.test(host)) return name;
      return host.replace(/^www\./, "");
    } catch { return ""; }
  }
  const URL_RE = /https?:\/\/[^\s<>"')]+/i;

  // ---------- tiny DOM helper ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (id) => document.getElementById(id);
  const arr = (x) => (Array.isArray(x) ? x.filter((v) => v != null && v !== "") : x ? [x] : []);
  const str = (x) => (x == null ? "" : typeof x === "string" ? x : typeof x === "number" ? String(x) : JSON.stringify(x));
  const money = (n) => {
    const v = Number(n);
    if (!isFinite(v)) return str(n);
    return "$" + Math.round(v).toLocaleString("en-US");
  };

  // ---------- state ----------
  let db = null, sample = null, downloads = null, imageLimits = null;
  let ideas = [];             // [{id, ...data}]
  let loaded = false, dbProblem = "";
  let filter = "all";
  let openId = null;
  let files = [];
  let busy = false;

  // ---------- capture form ----------
  const urlEl = $("url"), capEl = $("caption"), angleEl = $("angle");
  function showPlatform() {
    const u = urlEl.value.trim();
    const p = u ? platformOf(u) : "";
    $("platform").replaceChildren(p ? h("span", null, "From ", h("b", null, p)) : "");
  }
  urlEl.addEventListener("input", showPlatform);
  capEl.addEventListener("paste", () => setTimeout(() => {
    if (!urlEl.value.trim()) {
      const m = capEl.value.match(URL_RE);
      if (m) { urlEl.value = m[0]; showPlatform(); }
    }
  }, 0));

  $("files").addEventListener("change", (e) => {
    const max = imageLimits?.maxCount || 4;
    files = Array.from(e.target.files || []).slice(0, max);
    renderShots();
  });
  function renderShots() {
    const box = $("shots");
    box.querySelectorAll("img, .shotclear").forEach((n) => n.remove());
    for (const f of files) {
      const img = h("img", { alt: "Screenshot to send" });
      img.src = URL.createObjectURL(f);
      box.insertBefore(img, $("filebtn"));
    }
    if (files.length) box.append(h("button", { type: "button", class: "link shotclear", onclick: () => { files = []; $("files").value = ""; renderShots(); } }, "Remove"));
  }

  $("example").addEventListener("click", () => {
    urlEl.value = "https://www.instagram.com/reel/EXAMPLE/";
    capEl.value = "EXAMPLE POST — Nobody is doing this in small towns: trash can cleaning. I bought a pressure washer and a used trailer, charge $25 a can per month, and after 4 months I have 180 customers. Costs me about $4 a can. You can start this for under $3k. Comment CAN and I'll send my flyer template.";
    angleEl.value = "";
    showPlatform();
    capEl.focus();
  });

  function formMsg(text, kind) {
    const m = $("formMsg");
    if (!text) { m.hidden = true; m.textContent = ""; return; }
    m.hidden = false; m.className = "notice" + (kind === "err" ? " err" : ""); m.textContent = text;
  }

  function readForm() {
    return {
      url: urlEl.value.trim(),
      caption: capEl.value.trim(),
      angle: angleEl.value.trim(),
    };
  }
  function clearForm() {
    urlEl.value = ""; capEl.value = ""; angleEl.value = ""; files = []; $("files").value = "";
    renderShots(); showPlatform();
  }

  $("capture").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    const f = readForm();
    if (!f.caption && !files.length) {
      formMsg("Add the caption or a screenshot first. Claude can't open the link itself, so it needs one of those to work from. Or tap Save for later.", "err");
      return;
    }
    if (!sample) { formMsg("Claude isn't available in this view. Open the page on claude.ai while signed in, or tap Save for later.", "err"); return; }
    formMsg("");
    setBusy(true, "Reading the post…");
    try {
      const model = await generate(f, files);
      const doc = {
        createdAt: Date.now(), updatedAt: Date.now(), url: f.url, platform: f.url ? platformOf(f.url) : "",
        caption: f.caption, angle: f.angle, shots: files.length, status: "new", notes: "", model,
      };
      const id = await saveNew(doc);
      clearForm();
      openIdea(id);
    } catch (err) {
      formMsg(errText(err), "err");
    } finally { setBusy(false); }
  });

  $("saveBtn").addEventListener("click", async () => {
    if (busy) return;
    const f = readForm();
    if (!f.url && !f.caption) { formMsg("Paste a link or some text to save.", "err"); return; }
    formMsg("");
    try {
      await saveNew({
        createdAt: Date.now(), updatedAt: Date.now(), url: f.url, platform: f.url ? platformOf(f.url) : "",
        caption: f.caption, angle: f.angle, shots: 0, status: "saved", notes: "", model: null,
      });
      const hadShots = files.length > 0;
      clearForm();
      formMsg(hadShots ? "Saved. Screenshots aren't stored, so add them again when you build it." : "Saved to your ideas. Build it whenever you're ready.");
    } catch (err) { formMsg(errText(err), "err"); }
  });

  function setBusy(on, text) {
    busy = on;
    $("buildBtn").disabled = on; $("saveBtn").disabled = on;
    $("progress").hidden = !on;
    if (text) $("progressText").textContent = text;
  }

  function errText(err) {
    const code = err && err.code;
    if (code === "not_granted") return "Claude wasn't allowed for this page. Open the page's Permissions menu to allow it.";
    if (code === "rate_limited") return "You've hit your Claude usage limit for now. Save the idea and build it later.";
    if (code === "invalid_json") return "Claude's answer came back cut off. Try again, or shorten the caption.";
    if (code === "image_rejected") return "One of the screenshots couldn't be used. Try a PNG or JPEG.";
    if (code === "images_unavailable") return "Screenshots can't be sent from this view. Remove them and paste the caption instead.";
    return (err && err.message) || "Something went wrong. Try again.";
  }

  // ---------- Claude ----------
  const JOSHUA = `The person reviewing this is Joshua Grigson, Texarkana, Texas; family of five. What he already has to build on:
- An online store, "Prepared at Home": digital emergency-preparedness kits ($9), a Facebook page, Instagram, reels, and a comment-to-DM automation.
- A clip account, TheGamerzFeed (TikTok + Instagram), paid through Whop Content Rewards.
- He builds apps and websites with Claude (iOS apps on TestFlight, Netlify and Render sites, Shopify).
- Day job: call-center team lead (outbound sales coaching, dialer settings, call QA).
Limited cash and time; he favors things he can start small and automate.`;

  function buildPrompt(f, nShots) {
    return `You are a sharp, skeptical small-business analyst. Turn a business idea found on social media into a complete business model that the reader can review and decide on.

${JOSHUA}

THE POST
Link: ${f.url || "(none)"} (you cannot open it; work only from the text${nShots ? " and the " + nShots + " screenshot(s) attached, which are frames or captions from the post" : ""}).
Caption / what was said:
"""
${f.caption || "(no text; read the screenshots)"}
"""
${f.angle ? "Reader's steer: " + f.angle + "\n" : ""}
RULES
- Social posts exaggerate. Separate what the post claims from what is realistic, and say which claims look inflated or are really selling a course or template.
- All money in USD, as plain numbers (no $ or commas). Give realistic ranges for a solo founder in a small US city like Texarkana.
- Name competitors only if you are confident they exist; otherwise describe the type of competitor.

  }
  async function doDownload(i) {
    if (!downloads) { showDetailErr({ message: "Downloads aren't available in this view." }); return; }
    const slug = (str(i.model?.name) || "idea").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "idea";
    try { await downloads.save({ filename: slug + ".md", data: toMarkdown(i) }); }
    catch (err) { if (err && err.code !== "declined" && err.code !== "cancelled") showDetailErr(err); }
  }

  // ---------- boot ----------
  render();
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") {
    loaded = true; dbProblem = "Open this page on claude.ai, signed in, to save ideas and build models."; render();
    return;
  }
  cl.use("sample").then(async (s) => {
    sample = s;
    if (s) { try { imageLimits = (await s.limits()).images || null; } catch { imageLimits = null; } }
    if (!imageLimits) $("filebtn").hidden = true;
    else $("files").accept = imageLimits.mediaTypes.join(",");
  });
  cl.use("downloads").then((d) => { downloads = d; });
  cl.use("db").then((d) => {
    db = d;
    if (!d) { loaded = true; dbProblem = "Saving isn't available in this view. Ideas you build now will be gone when you close the page."; render(); return; }
    const timer = setTimeout(() => { if (!loaded) { loaded = true; dbProblem = "Your saved ideas are taking a while to load."; render(); } }, 10000);
    d.collection(COLL).orderBy("createdAt", "desc").limit(500).onSnapshot((snap) => {
      clearTimeout(timer);
      const local = ideas.filter((x) => x.id.startsWith("local-"));
      ideas = [...local, ...snap.docs.filter((x) => x.exists).map((x) => ({ id: x.id, ...x.data() }))];
      loaded = true; dbProblem = "";
      // keep a typing user's notes from being redrawn under them
      const active = document.activeElement;
      if (openId && active && active.tagName === "TEXTAREA" && $("detail").contains(active)) { renderTally(); return; }
      render();
    }, (err) => {
      clearTimeout(timer);
      loaded = true;
      dbProblem = err && err.code === "permission_denied" ? "Only Joshua can see these ideas." : "Couldn't load your saved ideas. Reload the page to try again.";
      render();
    });
  });
})();
</script>
